<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <title>Daymark — 每日探索打卡</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
    :root{--ink:#20251f;--muted:#858b80;--line:#e8eae3;--paper:#fff;--bg:#f6f7f2;--green:#36664b;--lime:#d7f379;--soft:#eef2e8;--orange:#f1a66e;--shadow:0 14px 45px #26331a0b}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans','Noto Sans SC',sans-serif;font-size:14px} button,a{font:inherit} button{cursor:pointer}
    .app{max-width:1440px;margin:auto;min-height:100vh;display:grid;grid-template-columns:230px 1fr}
    aside{border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column;min-height:100vh;background:#f8f9f5}
    .brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:800;letter-spacing:-.5px;padding:0 10px}.brand-icon{width:34px;height:34px;border-radius:11px;background:var(--green);display:grid;place-items:center;color:white;font-size:18px}
    .nav-label{color:#a2a69e;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;margin:43px 12px 12px}.nav{display:grid;gap:5px}.nav a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;color:#72786f;text-decoration:none;font-weight:600}.nav a.active{color:var(--green);background:#eaf0e8}.nav a span:first-child{width:19px;text-align:center;font-size:16px}.aside-bottom{margin-top:auto;padding:18px 10px 2px}.profile{border-top:1px solid var(--line);padding-top:20px;display:flex;gap:11px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#f3d9bc;display:grid;place-items:center;font-size:18px}.profile strong{display:block;font-size:13px}.profile small{color:var(--muted);font-size:11px}
    main{padding:34px clamp(22px,5vw,70px) 60px;max-width:1250px;width:100%;margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}.crumb{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:12px}.date-pill{background:white;border:1px solid var(--line);padding:9px 13px;border-radius:9px;color:#747a70;font-size:12px}.icon-btn{border:1px solid var(--line);background:white;width:36px;height:36px;border-radius:10px;color:#72786f}
    .hero{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;gap:18px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase;margin-bottom:10px}.hero h1{margin:0;font-size:clamp(29px,3.4vw,42px);letter-spacing:-1.7px;line-height:1.15}.hero p{color:#858b80;margin:11px 0 0;font-size:14px}.check-btn{background:var(--green);color:white;border:0;border-radius:10px;padding:13px 19px;font-weight:700;box-shadow:0 6px 14px #36664b26;transition:.2s}.check-btn:hover{transform:translateY(-2px);background:#2c583e}.check-btn.done{background:#eaf0e8;color:var(--green);box-shadow:none}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:28px 0 25px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:19px 20px;box-shadow:var(--shadow)}.stat-head{display:flex;justify-content:space-between;color:#7f857a;font-size:12px;font-weight:600}.stat-icon{font-size:16px}.stat strong{font-size:28px;letter-spacing:-1px;display:block;margin-top:13px}.stat small{font-size:11px;color:#989d94;margin-left:5px;font-weight:500;letter-spacing:0}.stat .positive{color:#579266;font-size:11px;margin-top:6px;display:block}
    .content-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:17px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.panel-head h2{margin:0;font-size:16px;letter-spacing:-.3px}.panel-head small{color:var(--muted);font-size:11px}.month-switch{display:flex;align-items:center;gap:13px;color:#747a70;font-size:12px;font-weight:600}.month-switch button{border:0;background:none;color:#878d83;font-size:18px;padding:0 3px}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;color:#a1a69c;font-size:10px;padding:4px 0 8px;font-weight:700}.day{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;color:#60675e;font-size:11px;position:relative}.day.empty{pointer-events:none}.day.checked{background:#eaf1e5;color:#326444;font-weight:700}.day.today{outline:1.5px solid #74977a;outline-offset:-2px}.day.checked:after{content:'✓';position:absolute;font-size:7px;right:5px;bottom:3px;color:#61916b}.day.future{color:#c7cbc3}.calendar-legend{display:flex;gap:15px;justify-content:flex-end;margin-top:13px;color:#999e95;font-size:10px}.legend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#dcebd6;margin-right:5px}.legend-today{background:#fff;border:1px solid #74977a}
    .week-row{display:flex;align-items:center;justify-content:space-between;gap:5px;margin:20px 0 4px}.weekday-card{text-align:center;flex:1}.weekday-card span{display:block;color:#9a9f96;font-size:10px;margin-bottom:8px}.weekday-card b{margin:auto;width:29px;height:29px;border-radius:50%;background:#f3f4ef;display:grid;place-items:center;color:#9da298;font-size:11px;font-weight:500}.weekday-card b.hit{background:#dff0d8;color:#426e4c}.week-note{border-top:1px solid var(--line);margin-top:17px;padding-top:14px;color:#91968e;font-size:11px}.week-note strong{color:#4e7354}
    .sites{display:grid;gap:11px}.site{border:1px solid #eceee8;border-radius:10px;padding:11px;display:flex;align-items:center;gap:11px;transition:.15s}.site:hover{border-color:#cbd9c9;transform:translateY(-1px)}.site-logo{width:37px;height:37px;border-radius:10px;display:grid;place-items:center;font-size:16px;font-weight:800;flex:none}.site-info{flex:1;min-width:0}.site-info strong{display:block;font-size:12px}.site-info small{display:block;color:#999e95;font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.site-link{color:#a4a99f;text-decoration:none;font-size:15px;padding:4px}.site-link:hover{color:var(--green)}.site-footer{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}.site-footer span{font-size:10px;color:#999e95}.text-btn{border:0;background:none;color:var(--green);font-weight:700;font-size:11px;padding:4px}.quote{margin-top:17px;background:#e9efe2;border-radius:12px;padding:17px 18px;position:relative;overflow:hidden}.quote:after{content:'✳';position:absolute;font-size:58px;color:#d8e4cf;right:11px;bottom:-13px}.quote small{font-size:9px;color:#6d8a6d;font-weight:800;letter-spacing:1px}.quote p{font-size:12px;line-height:1.65;margin:9px 0 0;color:#425543;max-width:85%}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#263c2c;color:white;padding:12px 18px;border-radius:10px;box-shadow:0 8px 30px #0002;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:900px){.app{grid-template-columns:75px 1fr}aside{padding:25px 10px;align-items:center}.brand{padding:0}.brand-name,.nav-label,.nav a .nav-text,.profile-info{display:none}.nav{margin-top:44px}.nav a{justify-content:center;padding:12px}.aside-bottom{padding:0}.profile{border:0}.content-grid{grid-template-columns:1fr}.right-col{display:grid;grid-template-columns:1fr 1fr;gap:15px}.quote{margin-top:0}}
    @media(max-width:600px){.app{display:block}aside{min-height:0;height:62px;width:100%;position:sticky;top:0;z-index:5;border-right:0;border-bottom:1px solid var(--line);padding:0 17px;flex-direction:row;justify-content:space-between}.brand{gap:8px}.brand-name{display:block;font-size:16px}.nav{display:flex;margin:0;gap:3px}.nav a{padding:9px}.nav a:nth-child(n+3){display:none}.nav a .nav-text,.profile,.aside-bottom{display:none}main{padding:25px 17px 40px}.topbar{margin-bottom:30px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:32px}.check-btn{width:100%}.stats{gap:8px}.stat{padding:14px 12px}.stat strong{font-size:23px}.stat-head{font-size:10px}.stat small{display:block;margin:2px 0}.stat .positive{font-size:9px}.panel{padding:17px}.right-col{display:block}.quote{margin-top:14px}.day{font-size:10px}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="brand-icon">✳</div><span class="brand-name">daymark</span></div>
    <div class="nav-label">Workspace</div>
    <nav class="nav">
      <a class="active" href="#today"><span>◷</span><span class="nav-text">今日打卡</span></a>
      <a href="#calendar"><span>▦</span><span class="nav-text">打卡日历</span></a>
      <a href="#sites"><span>↗</span><span class="nav-text">网站收藏</span></a>
    </nav>
    <div class="aside-bottom"><div class="profile"><div class="avatar">🧑🏻‍💻</div><div class="profile-info"><strong>探索者</strong><small>慢慢来，也很好</small></div></div></div>
  </aside>
  <main>
    <div class="topbar"><span class="crumb">我的空间　/　每日打卡</span><div class="top-actions"><span class="date-pill" id="date-pill"></span><button class="icon-btn" title="提醒">♧</button></div></div>
    <section class="hero" id="today"><div><div class="eyebrow">YOUR DAILY EXPLORATION</div><h1>今天，去看看世界吧<span style="color:#8ca878">.</span></h1><p>每天一点点，发现互联网另一边的新鲜事。</p></div><button class="check-btn" id="check-btn">完成今日打卡　→</button></section>
    <section class="stats">
      <div class="stat"><div class="stat-head">连续打卡 <span class="stat-icon">🔥</span></div><strong id="streak">0<small>天</small></strong><span class="positive">保持节奏，继续探索</span></div>
      <div class="stat"><div class="stat-head">本月打卡 <span class="stat-icon">✳</span></div><strong id="month-count">0<small>天</small></strong><span class="positive" id="month-progress">本月进度 0%</span></div>
      <div class="stat"><div class="stat-head">累计探索 <span class="stat-icon">↗</span></div><strong id="total-count">0<small>天</small></strong><span class="positive">每一次打开，都是新发现</span></div>
    </section>
    <div class="content-grid">
      <div class="left-col">
        <section class="panel" id="calendar"><div class="panel-head"><h2>打卡日历</h2><div class="month-switch"><button id="prev-month" aria-label="上个月">‹</button><span id="month-label"></span><button id="next-month" aria-label="下个月">›</button></div></div><div class="calendar" id="calendar-grid"></div><div class="calendar-legend"><span><i class="legend-dot"></i>已打卡</span><span><i class="legend-dot legend-today"></i>今天</span></div></section>
        <section class="panel" style="margin-top:15px"><div class="panel-head"><h2>本周节奏</h2><small id="week-label">一周一点点</small></div><div class="week-row" id="week-row"></div><div class="week-note">本周已经探索 <strong id="week-count">0 天</strong>，继续保持你的好奇心。</div></section>
      </div>
      <div class="right-col">
        <section class="panel" id="sites"><div class="panel-head"><h2>今日灵感</h2><small>精选海外网站</small></div><div class="sites" id="site-list"></div><div class="site-footer"><span>打开网站探索新知</span><button class="text-btn" id="add-site">＋ 添加网站</button></div></section>
        <div class="quote"><small>✦　A LITTLE REMINDER</small><p>好奇心是最好的旅行指南。今天的你，想去哪里看看？</p></div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
  const KEY='daymark-checkins-v1', SITEKEY='daymark-sites-v1';
  const defaults=[
    {name:'Product Hunt',url:'https://www.producthunt.com',desc:'发现新鲜有趣的产品',icon:'P',bg:'#fff0eb',color:'#da6548'},
    {name:'Hacker News',url:'https://news.ycombinator.com',desc:'科技与创业者社区',icon:'Y',bg:'#fff0e3',color:'#e46d23'},
    {name:'The Verge',url:'https://www.theverge.com',desc:'科技、科学与文化',icon:'V',bg:'#eee8fa',color:'#7254aa'},
    {name:'Unsplash',url:'https://unsplash.com',desc:'来自世界各地的灵感图片',icon:'✳',bg:'#e9f0ea',color:'#51745a'}
  ];
  let checks=JSON.parse(localStorage.getItem(KEY)||'[]');
  let sites=JSON.parse(localStorage.getItem(SITEKEY)||'null')||defaults;
  let view=new Date(); view.setDate(1);
  const pad=n=>String(n).padStart(2,'0'), keyDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const today=new Date(), todayKey=keyDate(today);
  const save=()=>localStorage.setItem(KEY,JSON.stringify(checks));
  function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
  function calcStreak(){let d=new Date();if(!checks.includes(keyDate(d))){d.setDate(d.getDate()-1);if(!checks.includes(keyDate(d)))return 0}let n=0;while(checks.includes(keyDate(d))){n++;d.setDate(d.getDate()-1)}return n}
  function renderStats(){const m=checks.filter(x=>x.startsWith(`${today.getFullYear()}-${pad(today.getMonth()+1)}-`)).length;document.getElementById('streak').innerHTML=`${calcStreak()}<small>天</small>`;document.getElementById('month-count').innerHTML=`${m}<small>天</small>`;document.getElementById('month-progress').textContent=`本月进度 ${Math.round(m/new Date(today.getFullYear(),today.getMonth()+1,0).getDate()*100)}%`;document.getElementById('total-count').innerHTML=`${checks.length}<small>天</small>`;let b=document.getElementById('check-btn');if(checks.includes(todayKey)){b.textContent='今日已打卡　✓';b.classList.add('done')}else{b.textContent='完成今日打卡　→';b.classList.remove('done')}}
  function renderCalendar(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;document.getElementById('month-label').textContent=`${y}年${m+1}月`;let html=['一','二','三','四','五','六','日'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<offset;i++)html+='<div class="day empty"></div>';for(let d=1;d<=days;d++){const dt=new Date(y,m,d),k=keyDate(dt),cls=['day',checks.includes(k)?'checked':'',k===todayKey?'today':'',dt>today?'future':''].join(' ');html+=`<div class="${cls}" title="${checks.includes(k)?'已打卡':''}">${d}</div>`}document.getElementById('calendar-grid').innerHTML=html}
  function renderWeek(){const monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));let labels=['一','二','三','四','五','六','日'],n=0;document.getElementById('week-row').innerHTML=labels.map((x,i)=>{let d=new Date(monday);d.setDate(monday.getDate()+i);let hit=checks.includes(keyDate(d));if(hit)n++;return `<div class="weekday-card"><span>${x}</span><b class="${hit?'hit':''}">${hit?'✓':d.getDate()}</b></div>`}).join('');document.getElementById('week-count').textContent=`${n} 天`}
  function renderSites(){document.getElementById('site-list').innerHTML=sites.map((s,i)=>`<div class="site"><div class="site-logo" style="background:${s.bg};color:${s.color}">${s.icon}</div><div class="site-info"><strong>${s.name}</strong><small>${s.desc}</small></div><a class="site-link" href="${s.url}" target="_blank" rel="noopener" title="打开 ${s.name}">↗</a></div>`).join('')}
  document.getElementById('date-pill').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(today);
  document.getElementById('check-btn').onclick=()=>{if(checks.includes(todayKey)){showToast('今天已经打过卡啦，明天见！');return}checks.push(todayKey);save();render();showToast('今日打卡成功，明天继续探索 ✨')};
  document.getElementById('prev-month').onclick=()=>{view.setMonth(view.getMonth()-1);renderCalendar()};document.getElementById('next-month').onclick=()=>{view.setMonth(view.getMonth()+1);renderCalendar()};
  document.getElementById('add-site').onclick=()=>{let name=prompt('网站名称：');if(!name)return;let url=prompt('网站网址（例如 https://example.com）：');if(!url)return;if(!/^https?:\/\//i.test(url))url='https://'+url;sites.push({name,url,desc:'我的收藏网站',icon:name[0].toUpperCase(),bg:'#edf0e8',color:'#51745a'});localStorage.setItem(SITEKEY,JSON.stringify(sites));renderSites();showToast('已添加到你的网站收藏')};
  function render(){renderStats();renderCalendar();renderWeek();renderSites()}render();
</script>
</body>
</html>
